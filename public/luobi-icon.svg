<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="luobi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37B0DE"/>
      <stop offset="1" stop-color="#8A5FC7"/>
    </linearGradient>
    <linearGradient id="luobi-bg-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块背景 -->
  <rect x="10" y="10" width="220" height="220" rx="56" fill="url(#luobi-bg)"/>
  <rect x="10" y="10" width="220" height="110" rx="56" fill="url(#luobi-bg-soft)"/>

  <!-- 落笔图形：钢笔 + 墨迹 -->
  <g transform="translate(-28 -10)">
    <!-- 流动的墨迹 -->
    <path d="M 80 154 C 98 184 146 196 180 182 C 202 173 216 154 220 134" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

    <!-- 钢笔（旋转 45°：笔尖朝左下，笔杆朝右上） -->
    <g transform="rotate(45 120 112)">
      <!-- 笔杆 -->
      <rect x="104" y="46" width="32" height="58" rx="13" fill="#FFFFFF"/>
      <!-- 笔握金属环 -->
      <rect x="102.5" y="97" width="35" height="7" rx="3.5" fill="#DFF2FF"/>
      <!-- 笔尖 -->
      <path d="M 96 104 C 96 122 108 146 120 168 C 132 146 144 122 144 104 Z" fill="#FFFFFF"/>
      <!-- 笔尖缝 -->
      <line x1="120" y1="166" x2="120" y2="124" stroke="#2E7FB8" stroke-width="4" stroke-linecap="round"/>
      <!-- 气孔 -->
      <circle cx="120" cy="127" r="4.5" fill="#2E7FB8"/>
    </g>
  </g>
</svg>
